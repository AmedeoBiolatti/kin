name: CI

on:
  workflow_call:
  push:
    # ci/** branches run CI on push, so workflow changes can be tried before a PR.
    branches: [main, 'ci/**', 'exp/3d-*', 'exp/rendering-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Tests create SDL windows; CI runners have no display or audio device.
  SDL_VIDEO_DRIVER: dummy
  SDL_AUDIO_DRIVER: dummy

jobs:
  select-run:
    name: Select CI event
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/github-script@v7
        id: select
        with:
          script: |
            let run = true;
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/') && context.ref !== 'refs/heads/main') {
              const branch = context.ref.replace('refs/heads/', '');
              const {data} = await github.rest.pulls.list({
                ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`, per_page: 1
              });
              run = data.length === 0;
            }
            // Documentation alone cannot change a build or a test. The jobs
            // below are skipped, which counts as passing for required checks
            // (a workflow-level paths filter would leave them pending).
            // docs/third_party_notices.md is the exception: packages ship it.
            const isDocumentation = path =>
              (path.startsWith('docs/') && path !== 'docs/third_party_notices.md') || /^[^/]+\.md$/.test(path);
            if (run) {
              try {
                let paths = null;
                if (context.eventName === 'pull_request') {
                  const files = await github.paginate(github.rest.pulls.listFiles, {
                    ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100
                  });
                  paths = files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                } else if (context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
                  const {data} = await github.rest.repos.compareCommitsWithBasehead({
                    ...context.repo, basehead: `${context.payload.before}...${context.payload.after}`, per_page: 100
                  });
                  // The comparison lists at most 300 files; a change that large is not documentation.
                  if (data.files.length < 300)
                    paths = data.files.flatMap(file => [file.filename, file.previous_filename].filter(Boolean));
                }
                if (paths && paths.length > 0 && paths.every(isDocumentation)) {
                  core.info(`Only documentation changed (${paths.length} files): skipping the builds.`);
                  run = false;
                }
              } catch (error) {
                core.warning(`Could not list the changed files, running everything: ${error.message}`);
              }
            }
            core.setOutput('run', String(run));
  format-3d:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: 3D C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format 18 policy
        run: |
          python3 -m venv .ci-format
          .ci-format/bin/python -m pip install clang-format==18.1.8
          python3 tools/format_3d.py --check --clang-format .ci-format/bin/clang-format

  build-2d:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: Linux 2D-only build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        with:
          packages: glslc
      - uses: ./.github/actions/ccache
        with:
          key: Linux 2D-only build
      - name: Install 2D import dependencies
        run: python3 -m pip install -r tools/requirements-imports.txt
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset 2d
      - name: Build
        run: cmake --build --preset 2d
      - name: Test
        run: ctest --preset 2d --timeout 300
      - name: Upload failed gameplay traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-traces-2d
          path: |
            build-2d/examples/2d_workflow/automation
            build-2d/examples/2d_workflow/development
          if-no-files-found: ignore

  # The experimental Box2D 3 backend (KIN_PHYSICS_BOX2D_V3): kin's 2D physics
  # tests on it, and its results the same on one Box2D thread as on four.
  physics-box2d-v3:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: Linux 2D physics on Box2D 3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        with:
          packages: glslc
      - uses: ./.github/actions/ccache
        with:
          key: Linux 2D physics on Box2D 3
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIN_PHYSICS_BOX2D_V3=ON
          -DKIN_BUILD_EXAMPLES=OFF -DKIN_EXPERIMENTAL_3D=OFF
      - name: Build
        run: >-
          cmake --build build --target kin_physics_tests kin_physics_component_tests kin_physics_shapes_tests
          kin_ecs_physics_tests kin_ecs_physics_shapes_tests kin_physics_character_tests kin_physics2d_bench
      - name: Test
        run: ctest --test-dir build -L '^component:PHYSICS$' --output-on-failure --timeout 300
      - name: Same results on 1 and 4 Box2D threads
        run: |
          one=$(KIN_PHYSICS_WORKERS=1 build/bin/kin_physics2d_bench 300 300 3000 | tee /dev/stderr | grep 'positions hash')
          four=$(KIN_PHYSICS_WORKERS=4 build/bin/kin_physics2d_bench 300 300 3000 | tee /dev/stderr | grep 'positions hash')
          test "$one" = "$four"

  build:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_SLOPPINESS: ${{ contains(matrix.options, 'KIN_ENABLE_PCH=ON') && 'pch_defines,time_macros' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            options: -DKIN_EXPERIMENTAL_3D=ON
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            options: >-
              -DKIN_EXPERIMENTAL_3D=ON -DKIN_ENABLE_PCH=ON -DKIN_ENABLE_WIDGET_PCH=ON
              -DCMAKE_CXX_FLAGS="-Xclang -fno-pch-timestamp"
          - name: Windows MSVC
            os: windows-2022
            options: -DKIN_EXPERIMENTAL_3D=ON -DKIN_ENABLE_PCH=ON -DKIN_ENABLE_WIDGET_PCH=ON
          - name: Linux minimal shipping
            profile: config
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            config: MinSizeRel
            options: >-
              -DKIN_BUILD_EXAMPLES=OFF -DKIN_BUILD_BENCHMARKS=OFF
              -DKIN_ENABLE_SCRIPTING=OFF -DKIN_ENABLE_PHYSICS=OFF -DKIN_ENABLE_AUDIO=OFF
              -DKIN_ENABLE_SCENE_SERVER=OFF -DKIN_ENABLE_DEVELOPMENT=OFF -DKIN_ENABLE_DEBUG_OVERLAY=OFF
              -DKIN_ENABLE_RELEASE_PROFILING=OFF -DKIN_ENABLE_RENDER_PROBE=OFF
              -DKIN_ENABLE_DETERMINISM_CHECK=OFF -DKIN_ENABLE_SIZE_OPTIMIZATIONS=ON
              -DKIN_ENABLE_LTO=ON -DKIN_PACKAGE_STRIP=ON -DKIN_PACKAGE_DEBUG_SYMBOLS=ON
              -DKIN_BUILD_GAME_ECS_GRAPH_DEMO=OFF -DKIN_BUILD_GAME_ECS_PARALLEL_BENCH=OFF
              -DKIN_BUILD_GAME_ECS_SYSTEMS_DEMO=OFF -DKIN_BUILD_GAME_ISOMETRIC_DEMO=OFF
              -DKIN_BUILD_GAME_LIGHTING_DEMO=OFF -DKIN_BUILD_GAME_SHAPES_DEMO=OFF
              -DKIN_BUILD_GAME_TEXT_EDIT_DEMO=OFF
          - name: Linux SDL software shipping baseline
            profile: config
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            config: MinSizeRel
            preset: hex-shipping
            options: >-
              -DKIN_RENDERER=software -DKIN_HEX_DEMO_BAKED_FONT=ON
              -DKIN_ENABLE_SDL_DYNAMIC_API=OFF
              -DKIN_ENABLE_SDL_GAMEPAD=OFF -DKIN_ENABLE_SDL_DESKTOP_SERVICES=OFF
              -DKIN_LINUX_VIDEO=x11-wayland
              -DKIN_BUILD_EXAMPLES=OFF -DKIN_BUILD_BENCHMARKS=OFF
              -DKIN_ENABLE_SCRIPTING=OFF -DKIN_ENABLE_PHYSICS=OFF -DKIN_ENABLE_AUDIO=OFF
              -DKIN_ENABLE_SCENE_SERVER=OFF -DKIN_ENABLE_DEVELOPMENT=OFF -DKIN_ENABLE_DEBUG_OVERLAY=OFF
              -DKIN_ENABLE_IMAGE_IO=OFF -DKIN_ENABLE_TTF=OFF
              -DKIN_ENABLE_RUNTIME_ASSETS=OFF -DKIN_ENABLE_RUNTIME_PROFILING=OFF
              -DKIN_ENABLE_RELEASE_PROFILING=OFF -DKIN_ENABLE_RENDER_PROBE=OFF
              -DKIN_ENABLE_DETERMINISM_CHECK=OFF -DKIN_ENABLE_SIZE_OPTIMIZATIONS=ON
              -DKIN_ENABLE_LTO=ON -DKIN_PACKAGE_STRIP=ON -DKIN_PACKAGE_DEBUG_SYMBOLS=ON
              -DKIN_BUILD_GAME_ECS_GRAPH_DEMO=OFF -DKIN_BUILD_GAME_ECS_PARALLEL_BENCH=OFF
              -DKIN_BUILD_GAME_ECS_SYSTEMS_DEMO=OFF -DKIN_BUILD_GAME_ISOMETRIC_DEMO=OFF
              -DKIN_BUILD_GAME_LIGHTING_DEMO=OFF -DKIN_BUILD_GAME_SHAPES_DEMO=OFF
              -DKIN_BUILD_GAME_TEXT_EDIT_DEMO=OFF
          - name: Windows scripting with direct SDL
            profile: config
            os: windows-2022
            options: >-
              -DKIN_BUILD_EXAMPLES=OFF -DKIN_ENABLE_PHYSICS=OFF -DKIN_ENABLE_AUDIO=OFF
              -DKIN_ENABLE_SDL_DYNAMIC_API=OFF
              -DKIN_ENABLE_SDL_GAMEPAD=OFF -DKIN_ENABLE_SDL_DESKTOP_SERVICES=OFF
              -DKIN_ENABLE_SCENE_SERVER=OFF -DKIN_ENABLE_DEVELOPMENT=OFF -DKIN_ENABLE_DEBUG_OVERLAY=OFF
              -DKIN_ENABLE_RELEASE_PROFILING=OFF -DKIN_ENABLE_RENDER_PROBE=OFF
              -DKIN_ENABLE_DETERMINISM_CHECK=OFF -DKIN_ENABLE_SIZE_OPTIMIZATIONS=ON
          - name: Linux compact CPU export
            profile: config
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            config: MinSizeRel
            preset: hex-small-compact
            options: -DKIN_LINUX_VIDEO=x11-wayland
          - name: Windows compact CPU export
            profile: config
            os: windows-2022
            config: MinSizeRel
            preset: hex-small-compact

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
        with:
          packages: glslc
      - name: Install 2D import dependencies
        if: ${{ !contains(matrix.options, 'KIN_BUILD_EXAMPLES=OFF') }}
        run: python -m pip install -r tools/requirements-imports.txt

      - uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.name }}

      # Puts cl on PATH. Windows builds with Ninja, as Linux does, so that ccache
      # can cache its compiles (it cannot with the Visual Studio generator).
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake ${{ matrix.preset && format('--preset {0}', matrix.preset) || '' }} -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config || 'Release' }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DKIN_TEST_PROFILE=${{ matrix.profile || 'all' }} ${{ matrix.options }}

      - name: Install glslc (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-shaderc

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          CC: cl
          CXX: cl
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $glslc = (Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/glslc.exe').Replace('\', '/')
          & $glslc --version
          cmake ${{ matrix.preset && format('--preset {0}', matrix.preset) || '' }} -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config || 'Release' }} -DKIN_TEST_PROFILE=${{ matrix.profile || 'all' }} ${{ matrix.options }} "-DKIN_GLSLC=$glslc"

      - name: Build
        run: cmake --build build --config ${{ matrix.config || 'Release' }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config || 'Release' }} --output-on-failure -j 4 --timeout 300
      - name: Upload failed gameplay traces
        if: ${{ failure() && !contains(matrix.options, 'KIN_BUILD_EXAMPLES=OFF') }}
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-traces-${{ matrix.name }}
          path: |
            build/examples/2d_workflow/automation
            build/examples/2d_workflow/development
          if-no-files-found: ignore

      - name: Package recommended SDL software export
        if: matrix.preset == 'hex-shipping'
        run: cmake --build build --config MinSizeRel --target hex_demo_package

      - name: Audit shipping compiler and linker commands
        if: runner.os == 'Linux' && matrix.preset == 'hex-shipping'
        run: python3 tools/audit_release_build.py --build build --target hex_demo --output build/packages/release-audit.json

      - name: Upload matching debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ matrix.name }}
          path: build/packages/*-symbols.zip
          if-no-files-found: ignore

      - name: Upload package size report
        uses: actions/upload-artifact@v4
        with:
          name: package-size-${{ matrix.name }}
          path: |
            build/packages/*.size.json
            build/component-reports/*.json
            build/generated/kin/components.json
            build/packages/*.components.json
            build/packages/*.cook.json
            build/asset-reports/*.cook.json
            build/packages/*.assets.json
            build/asset-reports/*.assets.json
            build/packages/release-audit.json

  # Signal Siege as Linux players get it. It is built in the Steam Runtime
  # (sniper, glibc 2.31), so it runs on Steam Deck and older distributions,
  # then unpacked elsewhere and run from another folder, both on this runner
  # and in the runtime: a game that needs anything from the build tree or the
  # working folder fails here. The package is kept as an artifact.
  ship-linux:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: Ship Linux (Steam Runtime)
    runs-on: ubuntu-24.04
    env:
      SNIPER_SDK: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
      CMAKE_VERSION: 3.31.6
      NINJA_VERSION: 1.12.1
    steps:
      - uses: actions/checkout@v4

      # SPIR-V is the same on every machine, and glslc does not run in the runtime.
      - name: Compile the shaders
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 glslc
          cmake -DOUTPUT_DIR="$PWD/spirv" -P cmake/kin_spirv.cmake

      # The runtime's CMake is older than kin needs.
      - name: CMake and Ninja for the runtime
        run: |
          mkdir -p .ci-tools/bin
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-linux-x86_64.tar.gz" \
            | tar xz -C .ci-tools --strip-components=1
          curl -fsSLo ninja.zip "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-linux.zip"
          unzip -q ninja.zip -d .ci-tools/bin
          rm ninja.zip

      - name: Package in the Steam Runtime
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e CC=gcc-14 -e CXX=g++-14 "$SNIPER_SDK" bash -euxc '
            export PATH=/src/.ci-tools/bin:$PATH
            cmake --preset ship -DKIN_SPIRV_DIR=/src/spirv
            cmake --build --preset ship --target signal_siege_package --parallel 4'

      - name: Needs nothing newer than the runtime
        run: |
          tar xzf build-ship/packages/signal_siege-*.tar.gz -C "$RUNNER_TEMP"
          game=$(ls "$RUNNER_TEMP"/signal_siege-*/signal_siege)
          newest=$(objdump -T "$game" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Newest glibc symbol: $newest"
          test "$(printf '%s\n' "$newest" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
          if objdump -p "$game" | grep -q 'NEEDED.*libstdc++'; then
            echo "The game links libstdc++ from the system"
            exit 1
          fi

      - name: Run the package from elsewhere
        run: bash .github/scripts/run-shipped-siege.sh "$PWD/build-ship/packages" "$RUNNER_TEMP/run"

      - name: Run the package in the Steam Runtime
        run: |
          docker run --rm -v "$PWD:/src" -e PATH="/src/.ci-tools/bin:/usr/local/bin:/usr/bin:/bin" "$SNIPER_SDK" \
            bash /src/.github/scripts/run-shipped-siege.sh /src/build-ship/packages /tmp/run

      - uses: actions/upload-artifact@v4
        with:
          name: signal-siege-linux
          path: build-ship/packages/*.tar.gz
          if-no-files-found: error

  # Signal Siege as Windows players get it, with the GPU backend's shaders
  # (glslc from the runner's MSYS2), run from another folder.
  ship-windows:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: Ship Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install glslc
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-shaderc

      - name: Configure
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $glslc = (Join-Path $env:MSYS2_LOCATION 'ucrt64/bin/glslc.exe').Replace('\', '/')
          & $glslc --version
          cmake --preset ship-vs "-DKIN_GLSLC=$glslc"

      # The Visual Studio generator compiles one project's sources one at a time;
      # /MP (the CL variable's options go to every cl.exe) spreads them over the cores.
      - name: Package
        env:
          CL: /MP
        run: cmake --build --preset ship-vs --target signal_siege_package --parallel 4

      - name: Run the package from elsewhere
        shell: bash
        run: bash .github/scripts/run-shipped-siege.sh "$GITHUB_WORKSPACE/build-ship/packages" "$RUNNER_TEMP/run"

      - uses: actions/upload-artifact@v4
        with:
          name: signal-siege-windows
          path: build-ship/packages/*.zip
          if-no-files-found: error

  # The SDL_GPU backend's tests skip without a GPU, so the jobs above never run
  # them. These give them Mesa's software Vulkan driver (lavapipe) and a
  # virtual X display, and require them to run. The big kin-render3d suite
  # (7 of the 10 minutes of tests on a runner) has a job of its own, so the
  # others run beside it instead of before it.
  gpu:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GPU (lavapipe, Release)
            artifact: gpu-tests-Release
            build_type: Release
            examples: 'ON'
            tests: '.'
            skip: '^kin-render3d-shard-'
            graphs: true
          # The three shards of kin-render3d (tests/CMakeLists.txt); a shard
          # needs only its test executable built.
          - name: Linux GPU (lavapipe, render3d 1 of 3)
            artifact: gpu-tests-render3d-1
            cache: Linux GPU (lavapipe, render3d)
            build_type: Release
            examples: 'OFF'
            target: kin_render3d_tests
            tests: '^kin-render3d-shard-0$'
          - name: Linux GPU (lavapipe, render3d 2 of 3)
            artifact: gpu-tests-render3d-2
            cache: Linux GPU (lavapipe, render3d)
            build_type: Release
            examples: 'OFF'
            target: kin_render3d_tests
            tests: '^kin-render3d-shard-1$'
          - name: Linux GPU (lavapipe, render3d 3 of 3)
            artifact: gpu-tests-render3d-3
            cache: Linux GPU (lavapipe, render3d)
            build_type: Release
            examples: 'OFF'
            target: kin_render3d_tests
            tests: '^kin-render3d-shard-2$'
          - name: Linux GPU (lavapipe, Debug)
            artifact: gpu-tests-Debug
            build_type: Debug
            examples: 'OFF'
            tests: '^kin-(script-scene3d(-gpu)?|scene-pipeline3d|scene-frame3d|scene-session3d|physics3d(-ecs|-ragdoll|-rope)?|skeleton|gpu-memory|render3d-.+|(vision3d|outline3d|surface3d|ascii3d|slowlight3d)-graph)$'
            # render3d-.+ above also matches the shards of the big render3d suite,
            # which run in the Release jobs only.
            skip: 'render3d-shard'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDL_VIDEO_DRIVER: x11
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      KIN_REQUIRE_GPU_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      # glslc compiles the GPU backend's shaders; without them it cannot start.
      - uses: ./.github/actions/linux-deps
        with:
          packages: mesa-vulkan-drivers vulkan-validationlayers glslc xvfb
      - name: Install 2D import dependencies
        if: matrix.examples == 'ON'
        run: python3 -m pip install -r tools/requirements-imports.txt

      # The shards compile the same units, so they share one cache.
      - uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.cache || matrix.name }}

      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        # The Debug tests with full -g filled the runner's disk while linking
        # (No space left on device); -g1 keeps backtraces and asserts, at a
        # third of the size. Asserts stay on in Debug whatever the debug info.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DKIN_EXPERIMENTAL_3D=ON -DKIN_BUILD_EXAMPLES=${{ matrix.examples }} -DKIN_BUILD_GAMES=OFF ${{ matrix.build_type == 'Debug' && '-DCMAKE_C_FLAGS_DEBUG=-g1 -DCMAKE_CXX_FLAGS_DEBUG=-g1' || '' }}

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cmake --build build --parallel 4 ${TARGET:+--target "$TARGET"}

      - name: Every render3d shard has a job
        if: matrix.graphs
        run: test "$(ctest --test-dir build -N -R '^kin-render3d-shard-' | grep -c 'Test *#')" -eq 3

      - name: Test
        # Release runs every suite with a GPU and the examples enabled, so
        # new GPU workflows cannot silently fall outside a hand-maintained list.
        # Renderer and particle-shadow suites set longer TIMEOUT properties
        # in tests/CMakeLists.txt, which take precedence over this default.
        env:
          SKIP: ${{ matrix.skip }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build -R '${{ matrix.tests }}' ${SKIP:+-E "$SKIP"} --output-on-failure --timeout 300 --no-tests=error --output-junit "$PWD/build/ctest.xml"
      - name: Upload failed gameplay traces
        if: ${{ failure() && matrix.examples == 'ON' }}
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-traces-${{ matrix.artifact }}
          path: |
            build/examples/2d_workflow/automation
            build/examples/2d_workflow/development
          if-no-files-found: ignore

      - name: Rendering graphs with Vulkan core validation
        if: matrix.graphs
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 .github/scripts/rendering-gpu-check.py --build build --mode core --output out/rendering-core

      - name: Rendering graphs with Vulkan synchronization validation
        if: matrix.graphs
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 .github/scripts/rendering-gpu-check.py --build build --mode sync --output out/rendering-sync

      - name: Debug rope presentation on the GPU
        if: matrix.build_type == 'Debug'
        run: xvfb-run -a -s "-screen 0 1280x800x24" build/bin/kin_render3d_tests test_gpu_rope_tube

      - name: Upload GPU test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/ctest.xml
            build/Testing/Temporary/LastTest.log
            out/rendering-*/
          if-no-files-found: warn

  # The ruleset requires a check named "Linux GPU (lavapipe)". The Release GPU
  # jobs above split that work, so this job takes the name and passes when all
  # four of them pass. (The Debug job is not part of it, as before.) Called from
  # the release workflow, the job names carry a "tests / " prefix.
  gpu-required:
    name: Linux GPU (lavapipe)
    needs: [select-run, gpu]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: The Release GPU jobs passed
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ needs.select-run.outputs.run }}
        run: |
          if [ "$SELECTED" != true ]; then
            echo "CI was not selected for this change."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
            --jq '.jobs[] | select(.name | test("(^|/ )Linux GPU \\(lavapipe, (Release|render3d [0-9] of 3)\\)$")) | "\(.name): \(.conclusion)"' | tee jobs.txt
          test "$(wc -l < jobs.txt)" -eq 4
          ! grep -v ': success$' jobs.txt

  rendering-sanitizers:
    needs: select-run
    if: needs.select-run.outputs.run == 'true'
    name: Rendering ASAN and UBSAN (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang-18
      CXX: clang++-18
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
        with:
          packages: mesa-vulkan-drivers glslc xvfb
      - uses: ./.github/actions/ccache
        with:
          key: Rendering ASAN and UBSAN
      - name: Configure rendering-only sanitizer build
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DKIN_EXPERIMENTAL_3D=ON -DKIN_ENABLE_PHYSICS3D=OFF
          -DKIN_ENABLE_SCENE3D_RUNTIME=OFF -DKIN_ENABLE_SCRIPTING=OFF
          -DKIN_ENABLE_AUDIO=OFF -DKIN_ENABLE_TTF=OFF
          -DKIN_BUILD_EXAMPLES=OFF -DKIN_BUILD_GAMES=OFF -DKIN_BUILD_BENCHMARKS=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Require the rendering integration tests
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 .github/scripts/rendering-gpu-check.py --build build --config Debug --output out/rendering-sanitizers
      - name: Upload sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendering-sanitizers
          path: |
            out/rendering-sanitizers/
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
