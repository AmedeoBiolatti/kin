name: CI

on:
  push:
    # ci/** branches run CI on push, so workflow changes can be tried before a PR.
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tests create SDL windows; CI runners have no display or audio device.
  SDL_VIDEO_DRIVER: dummy
  SDL_AUDIO_DRIVER: dummy

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            # The SDL_GPU backend's tests skip without a GPU. This job also gives
            # them Mesa's software Vulkan driver (lavapipe) and a virtual X
            # display, and requires them to run. glslc compiles the backend's
            # shaders; without them it cannot start.
            gpu: true
            packages: mesa-vulkan-drivers glslc xvfb
          - name: Linux Clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: Windows MSVC
            os: windows-2022
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: .github/scripts/install-linux-deps.sh ${{ matrix.packages }}

      # Puts cl on PATH, so Windows builds with Ninja like Linux does.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # Pull requests reuse main's compiler cache; only pushes save one.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          save: ${{ github.event_name == 'push' }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4 --timeout 300

      - name: Test SDL_GPU backend (lavapipe)
        if: matrix.gpu
        env:
          SDL_VIDEO_DRIVER: x11
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          KIN_REQUIRE_GPU_TESTS: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" ctest --test-dir build -R '^kin-renderer$' --output-on-failure --timeout 300
