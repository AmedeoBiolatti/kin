name: Experimental WebGL2

on:
  push:
    branches: ['main', 'exp/rendering-*']
  pull_request:
    paths:
      - 'engine/**'
      - 'cmake/**'
      - 'games/hex_demo/**'
      - 'experimental/webgl2/**'
      - 'web/**'
      - 'tests/webgl2_smoke.mjs'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/webgl2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webgl2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: hex-webgl2
            target: hex_demo
            mode: hex
          - preset: hex-webgl2-modules
            target: hex_demo
            mode: hex
          - preset: webgl2-3d
            target: webgl2_3d_fixture
            mode: 3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Emscripten and build the browser bundle
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.13
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.13
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset ${{ matrix.preset }}
          cmake --build build/${{ matrix.preset }} --target ${{ matrix.target }}_package --parallel 4
      - name: Check WebGL2 rendering and game input in an iframe
        shell: bash
        run: node tests/webgl2_smoke.mjs --mode ${{ matrix.mode }} --root build/${{ matrix.preset }}/web/${{ matrix.target }} --output out/webgl2-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/packages/${{ matrix.target }}-webgl2.zip
            build/${{ matrix.preset }}/bin/${{ matrix.target }}.html.symbols
            out/webgl2-smoke/
